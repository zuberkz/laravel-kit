# Проверки кода до выкладки: красная проверка — деплоя нет. Pint и Larastan — если в проекте есть их конфиг.
# Часть общего деплоя (.github/workflows/deploy.yml); БД для тестов (mariadb, pgsql) поднимает сам workflow.
# Пуш только с фронтом (стили, скрипты, картинки, шрифты — frontend-paths) проверки пропускает: PHP-тесты их не проверяют,
# сборка фронта (npm audit, lint, build) идёт в build как обычно. Запуск вручную и неизвестный список изменений — проверки целиком.
name: Checks
description: composer audit, Pint, Larastan и тесты

inputs:
    database:
        description: БД для тестов — sqlite (из phpunit.xml), mariadb или pgsql
        default: sqlite
    test-setup:
        description: Команды перед тестами, после key:generate — например php artisan passport:keys
        default: ''
    frontend-paths:
        description: Регулярное выражение путей фронта; пуш, где все изменённые файлы под него подходят, проверки пропускает
        default: '^(resources/(css|js)/|public/(images|fonts|icons)/)'

runs:
    using: composite
    steps:
        -   name: Changed files
            id: scope
            shell: bash
            env:
                EVENT: ${{ github.event_name }}
                BEFORE: ${{ github.event.before }}
                AFTER: ${{ github.sha }}
                FRONTEND: ${{ inputs.frontend-paths }}
            run: |
                # Не push, первый пуш ветки или прошлый коммит недоступен (force push) — проверяем всё
                if [ "$EVENT" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
                    || ! git fetch --no-tags --depth=1 origin "$BEFORE" 2>/dev/null; then
                    echo "frontend-only=false" >> "$GITHUB_OUTPUT"
                    exit 0
                fi

                changed=$(git diff --name-only "$BEFORE" "$AFTER")
                other=$(printf '%s\n' "$changed" | grep -vE "$FRONTEND" | grep -v '^$' || true)

                if [ -n "$changed" ] && [ -z "$other" ]; then
                    echo "::notice::Изменён только фронт — проверки кода пропущены: $(printf '%s' "$changed" | paste -sd ',' - | sed 's/,/, /g')"
                    echo "frontend-only=true" >> "$GITHUB_OUTPUT"
                else
                    echo "frontend-only=false" >> "$GITHUB_OUTPUT"
                fi

        -   name: Check code
            if: hashFiles('composer.json') != '' && steps.scope.outputs.frontend-only != 'true'
            shell: bash
            env:
                DATABASE: ${{ inputs.database }}
                TEST_SETUP: ${{ inputs.test-setup }}
            run: |
                # Известная уязвимость в зависимостях — деплоя нет; заброшенные пакеты только показываем
                composer audit --locked --abandoned=report
                if [ -f pint.json ]; then vendor/bin/pint --test; fi
                if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ]; then vendor/bin/phpstan analyse --no-progress --memory-limit=1G; fi
                if [ -f artisan ] && [ -d tests ]; then
                    # Для sqlite переменные не задаются: phpunit.xml сам выбирает базу в памяти
                    case "$DATABASE" in
                        mariadb) export DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=testing DB_USERNAME=testing DB_PASSWORD=secret ;;
                        pgsql) export DB_HOST=127.0.0.1 DB_PORT=5432 DB_DATABASE=testing DB_USERNAME=testing DB_PASSWORD=secret ;;
                    esac
                    [ -f .env ] || cp .env.example .env 2>/dev/null || touch .env
                    php artisan key:generate --force --no-interaction
                    if [ -n "$TEST_SETUP" ]; then bash -c "$TEST_SETUP"; fi
                    # sqlite в памяти — тесты параллельно, по процессу на ядро (~на треть быстрее).
                    # mariadb и pgsql — подряд: параллельный режим создаёт базу на процесс, а у тестового пользователя нет прав
                    if [ "$DATABASE" = "sqlite" ] && [ -f vendor/bin/paratest ]; then
                        php artisan test --parallel
                    else
                        php artisan test
                    fi
                    rm -f .env
                fi
