# Окружение и сборка: PHP, зависимости composer и npm (с кэшем), сборка фронта с проверками npm.
# Часть общего деплоя (.github/workflows/deploy.yml); в проекте отдельно не вызывается.
name: Build
description: PHP, composer и npm с кэшем, сборка фронта

inputs:
    php-version:
        description: Версия PHP — та же, что на сервере
        required: true
    php-extensions:
        description: Дополнительные расширения PHP, через запятую
        default: ''
    database:
        description: БД для тестов (pgsql добавляет pdo_pgsql)
        default: sqlite
    deploy-branch:
        description: Ветка, в которую коммитится composer.lock, если его нет
        required: true

runs:
    using: composite
    steps:
        -   name: Set up PHP
            if: hashFiles('composer.json') != ''
            uses: shivammathur/setup-php@v2
            with:
                php-version: ${{ inputs.php-version }}
                extensions: ${{ inputs.database == 'pgsql' && format('pdo_pgsql, {0}', inputs.php-extensions) || inputs.php-extensions }}
                tools: composer

        # Без composer.lock версии зависимостей случайны: фиксируем их один раз и коммитим lock
        -   name: Commit composer.lock
            if: hashFiles('composer.json') != '' && hashFiles('composer.lock') == ''
            shell: bash
            env:
                DEPLOY_BRANCH: ${{ inputs.deploy-branch }}
            run: |
                composer update --no-install --no-scripts --no-interaction --prefer-dist
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add composer.lock
                git commit -m "chore(deps): зафиксировать composer.lock"
                git push origin "HEAD:${DEPLOY_BRANCH}"

        # Кэш vendor по composer.lock и версии PHP: lock не менялся — пакеты не скачиваются и не распаковываются,
        # composer install только сверяет vendor с lock и запускает скрипты пакетов
        -   name: Restore PHP dependencies
            id: vendor-cache
            if: hashFiles('composer.lock') != ''
            uses: actions/cache/restore@v4
            with:
                path: vendor
                key: vendor-${{ runner.os }}-php${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}

        # Зависимости до сборки стилей: стили сайта импортируют CSS пакетов из vendor (поля Filament)
        -   name: Install dependencies
            if: hashFiles('composer.json') != ''
            shell: bash
            run: composer install --no-interaction --prefer-dist --no-progress

        # Сохраняем сразу после установки — с dev-пакетами для проверок, до composer install --no-dev при выкладке
        -   name: Save PHP dependencies
            if: hashFiles('composer.lock') != '' && steps.vendor-cache.outputs.cache-hit != 'true'
            uses: actions/cache/save@v4
            with:
                path: vendor
                key: vendor-${{ runner.os }}-php${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}

        # Кэш node_modules по package-lock.json и версии Node: npm ci всегда удаляет node_modules,
        # поэтому при попадании в кэш установка пропускается целиком
        -   name: Node version
            id: node
            if: hashFiles('package-lock.json') != ''
            shell: bash
            run: echo "version=$(node -v)" >> "$GITHUB_OUTPUT"

        -   name: Restore JS dependencies
            id: node-cache
            if: hashFiles('package-lock.json') != ''
            uses: actions/cache/restore@v4
            with:
                path: node_modules
                key: node-modules-${{ runner.os }}-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}

        -   name: Install JS dependencies
            if: hashFiles('package.json') != '' && steps.node-cache.outputs.cache-hit != 'true'
            shell: bash
            run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

        -   name: Save JS dependencies
            if: hashFiles('package-lock.json') != '' && steps.node-cache.outputs.cache-hit != 'true'
            uses: actions/cache/save@v4
            with:
                path: node_modules
                key: node-modules-${{ runner.os }}-${{ steps.node.outputs.version }}-${{ hashFiles('package-lock.json') }}

        # Сборка до проверок: тесты страниц видят манифест Vite
        -   name: Build assets
            if: hashFiles('package.json') != ''
            shell: bash
            run: |
                # Уязвимости high и critical в зависимостях сайта (без dev) останавливают деплой
                npm audit --omit=dev --audit-level=high
                npm run lint --if-present
                npm run test --if-present
                if npm run | grep -qE '^  build$'; then npm run build; else echo "No build script"; fi
