# Общий деплой Laravel-проекта на сервер ISPmanager: проверки → сборка → rsync → artisan на сервере.
# Проект вызывает его из своего .github/workflows/deploy.yml (пример — README пакета) и передаёт
# переменные и секреты репозитория. Несовместимое изменение входов — новый файл deploy-v2.yml,
# этот остаётся как есть: его используют все проекты с ref @main.
name: "🚀 Deploy (reusable)"

on:
    workflow_call:
        inputs:
            app-dir:
                description: Каталог сайта на сервере (vars.APP_DIR)
                type: string
                required: true
            php:
                description: Путь к php нужной версии на сервере (vars.PHP)
                type: string
                required: true
            deploy-branch:
                description: Ветка, в которую коммитится composer.lock, если его нет (vars.DEPLOY_BRANCH); пусто — ветка запуска
                type: string
                default: ''
            auto-migrate:
                description: Выполнять migrate --force на сервере (vars.AUTO_MIGRATE)
                type: string
                default: 'true'
            deploy-env:
                description: staging — проверки кода пропускаются (их гоняют локально), иначе обязательны (vars.DEPLOY_ENV)
                type: string
                default: production
            rsync-exclude:
                description: Каталоги, которые живут только на сервере, через пробел — rsync их не удаляет (vars.RSYNC_EXCLUDE)
                type: string
                default: ''
            php-version:
                description: Версия PHP в Actions — та же, что на сервере
                type: string
                default: '8.5'
            php-extensions:
                description: Дополнительные расширения PHP для проверок, через запятую
                type: string
                default: ''
            database:
                description: БД для тестов — sqlite (из phpunit.xml), mariadb или pgsql (как на проде)
                type: string
                default: sqlite
        secrets:
            SSH_HOST:
                required: true
            SSH_USER:
                required: true
            SSH_PORT:
                required: true
            DEPLOY_KEY:
                required: true

env:
    APP_DIR: ${{ inputs.app-dir }}
    PHP: ${{ inputs.php }}
    DEPLOY_BRANCH: ${{ inputs.deploy-branch || github.ref_name }}
    AUTO_MIGRATE: ${{ inputs.auto-migrate }}
    RSYNC_EXCLUDE: ${{ inputs.rsync-exclude }}
    DATABASE: ${{ inputs.database }}

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        # Тесты на движке прода, когда код использует его возможности (правило testing.md).
        # Сервис с пустым image не запускается: поднимается только выбранная БД
        services:
            mariadb:
                image: ${{ inputs.database == 'mariadb' && 'mariadb:11' || '' }}
                env:
                    MARIADB_DATABASE: testing
                    MARIADB_USER: testing
                    MARIADB_PASSWORD: secret
                    MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "healthcheck.sh --connect --innodb_initialized"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 30
            postgres:
                image: ${{ inputs.database == 'pgsql' && 'postgres:17-alpine' || '' }}
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: testing
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U testing -d testing"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 30

        steps:
            -   uses: actions/checkout@v5

            -   name: Set up PHP
                if: hashFiles('composer.json') != ''
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ inputs.php-version }}
                    extensions: ${{ inputs.database == 'pgsql' && format('pdo_pgsql, {0}', inputs.php-extensions) || inputs.php-extensions }}
                    tools: composer

            # Без composer.lock версии зависимостей случайны: фиксируем их один раз и коммитим lock
            -   name: Commit composer.lock
                if: hashFiles('composer.json') != '' && hashFiles('composer.lock') == ''
                run: |
                    composer update --no-install --no-scripts --no-interaction --prefer-dist
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add composer.lock
                    git commit -m "chore(deps): зафиксировать composer.lock"
                    git push origin "HEAD:${DEPLOY_BRANCH}"

            # Сборка до проверок: тесты страниц видят манифест Vite
            -   name: Build assets
                if: hashFiles('package.json') != ''
                run: |
                    if [ -f package-lock.json ]; then npm ci; else npm install; fi
                    # Уязвимости high и critical в зависимостях сайта (без dev) останавливают деплой
                    npm audit --omit=dev --audit-level=high
                    npm run lint --if-present
                    npm run test --if-present
                    if npm run | grep -qE '^  build$'; then npm run build; else echo "No build script"; fi

            # Проверки кода до выкладки: красная проверка — деплоя нет. Pint и Larastan — если в проекте есть их конфиг
            -   name: Check code
                if: hashFiles('composer.json') != '' && inputs.deploy-env != 'staging'
                run: |
                    composer install --no-interaction --prefer-dist --no-progress
                    # Известная уязвимость в зависимостях — деплоя нет; заброшенные пакеты только показываем
                    composer audit --locked --abandoned=report
                    if [ -f pint.json ]; then vendor/bin/pint --test; fi
                    if [ -f phpstan.neon ] || [ -f phpstan.neon.dist ]; then vendor/bin/phpstan analyse --no-progress --memory-limit=1G; fi
                    if [ -f artisan ] && [ -d tests ]; then
                        # Для sqlite переменные не задаются: phpunit.xml сам выбирает базу в памяти
                        case "$DATABASE" in
                            mariadb) export DB_HOST=127.0.0.1 DB_PORT=3306 DB_DATABASE=testing DB_USERNAME=testing DB_PASSWORD=secret ;;
                            pgsql) export DB_HOST=127.0.0.1 DB_PORT=5432 DB_DATABASE=testing DB_USERNAME=testing DB_PASSWORD=secret ;;
                        esac
                        [ -f .env ] || cp .env.example .env 2>/dev/null || touch .env
                        php artisan key:generate --force --no-interaction
                        php artisan test
                        rm -f .env
                    fi

            # На сервер — без dev-пакетов: там не нужны ни composer, ни доступ к Packagist
            -   name: Install PHP dependencies
                if: hashFiles('composer.json') != ''
                run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

            -   name: Upload to server
                env:
                    SSH_HOST: ${{ secrets.SSH_HOST }}
                    SSH_USER: ${{ secrets.SSH_USER }}
                    SSH_PORT: ${{ secrets.SSH_PORT }}
                    DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
                run: |
                    install -m 600 /dev/null ~/deploy_key
                    printf '%s\n' "$DEPLOY_KEY" > ~/deploy_key
                    SSH="ssh -p $SSH_PORT -i $HOME/deploy_key -o StrictHostKeyChecking=accept-new"

                    # Исключённое rsync не удаляет на сервере: .env, данные storage, ссылку public/storage,
                    # проверки Let's Encrypt и каталоги из RSYNC_EXCLUDE. bootstrap/cache едет вместе с vendor:
                    # манифест пакетов собран composer install выше, старые кэши удаляются, optimize соберёт заново
                    excludes=(--exclude=/.git/ --exclude=/.github/ --exclude=/node_modules/ --exclude=/.env --exclude=/storage/
                        --exclude=/public/storage --exclude=/public/.well-known/)
                    for path in $RSYNC_EXCLUDE; do excludes+=("--exclude=/${path#/}"); done

                    rsync -az --delete "${excludes[@]}" -e "$SSH" ./ "$SSH_USER@$SSH_HOST:$APP_DIR/"

                    # Структура storage нужна на новом сервере, но существующие файлы не трогаем
                    if [ -d storage ]; then rsync -az --ignore-existing -e "$SSH" storage/ "$SSH_USER@$SSH_HOST:$APP_DIR/storage/"; fi

                    rm -f ~/deploy_key

            -   name: Finish on server
                if: hashFiles('artisan') != ''
                uses: appleboy/ssh-action@v1.2.5
                with:
                    host: ${{ secrets.SSH_HOST }}
                    username: ${{ secrets.SSH_USER }}
                    key: ${{ secrets.DEPLOY_KEY }}
                    port: ${{ secrets.SSH_PORT }}
                    command_timeout: 10m
                    envs: APP_DIR,PHP,AUTO_MIGRATE
                    script: |
                        set -euo pipefail

                        cd "$APP_DIR"

                        if [ ! -f .env ]; then
                            echo "::error::$APP_DIR/.env is missing: create it with isp-write-env and run the deploy again"
                            exit 1
                        fi

                        if [ "${AUTO_MIGRATE:-true}" = "true" ]; then
                            "$PHP" artisan migrate --force
                            # Роли и права — по RoleEnum проекта; без spatie/laravel-permission команды нет
                            if "$PHP" artisan list --raw | grep -q '^kit:sync-roles'; then
                                "$PHP" artisan kit:sync-roles --no-interaction
                            fi
                        fi

                        [ -e public/storage ] || "$PHP" artisan storage:link
                        "$PHP" artisan optimize

                        echo "Deploy complete"
