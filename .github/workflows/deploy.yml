# Общий деплой Laravel-проекта на сервер ISPmanager: сборка → проверки → rsync → artisan на сервере.
# Проект вызывает его из своего .github/workflows/deploy.yml (пример — README пакета) и передаёт
# переменные и секреты репозитория. Несовместимое изменение входов — новый файл deploy-v2.yml,
# этот остаётся как есть: его используют все проекты с ref @main.
# Шаги — composite actions в .github/actions (build, checks, upload, finish), один job: каждый job заново
# поднимает машину и округляет минуты. Actions подключаются по полному адресу @main — относительный путь
# внутри reusable workflow указывал бы на репозиторий проекта.
name: "🚀 Deploy (reusable)"

on:
    workflow_call:
        inputs:
            app-dir:
                description: Каталог сайта на сервере (vars.APP_DIR)
                type: string
                required: true
            php:
                description: Путь к php нужной версии на сервере (vars.PHP)
                type: string
                required: true
            deploy-branch:
                description: Ветка, в которую коммитится composer.lock, если его нет (vars.DEPLOY_BRANCH); пусто — ветка запуска
                type: string
                default: ''
            auto-migrate:
                description: Выполнять migrate --force на сервере (vars.AUTO_MIGRATE)
                type: string
                default: 'true'
            deploy-env:
                description: staging — проверки кода пропускаются (их гоняют локально), иначе обязательны (vars.DEPLOY_ENV)
                type: string
                default: production
            rsync-exclude:
                description: Каталоги, которые живут только на сервере, через пробел — rsync их не удаляет (vars.RSYNC_EXCLUDE)
                type: string
                default: ''
            php-version:
                description: Версия PHP в Actions — та же, что на сервере
                type: string
                default: '8.5'
            php-extensions:
                description: Дополнительные расширения PHP для проверок, через запятую
                type: string
                default: ''
            database:
                description: БД для тестов — sqlite (из phpunit.xml), mariadb или pgsql (как на проде)
                type: string
                default: sqlite
            test-setup:
                description: Команды перед тестами, после key:generate — например php artisan passport:keys
                type: string
                default: ''
        secrets:
            SSH_HOST:
                required: true
            SSH_USER:
                required: true
            SSH_PORT:
                required: true
            DEPLOY_KEY:
                required: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        # Тесты на движке прода, когда код использует его возможности (правило testing.md).
        # Сервис с пустым image не запускается: поднимается только выбранная БД
        services:
            mariadb:
                image: ${{ inputs.database == 'mariadb' && 'mariadb:11' || '' }}
                env:
                    MARIADB_DATABASE: testing
                    MARIADB_USER: testing
                    MARIADB_PASSWORD: secret
                    MARIADB_RANDOM_ROOT_PASSWORD: 'yes'
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "healthcheck.sh --connect --innodb_initialized"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 30
            postgres:
                image: ${{ inputs.database == 'pgsql' && 'postgres:17-alpine' || '' }}
                env:
                    POSTGRES_DB: testing
                    POSTGRES_USER: testing
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U testing -d testing"
                    --health-interval 5s
                    --health-timeout 3s
                    --health-retries 30

        steps:
            -   uses: actions/checkout@v5

            -   uses: zuberkz/laravel-kit/.github/actions/build@main
                with:
                    php-version: ${{ inputs.php-version }}
                    php-extensions: ${{ inputs.php-extensions }}
                    database: ${{ inputs.database }}
                    deploy-branch: ${{ inputs.deploy-branch || github.ref_name }}

            -   uses: zuberkz/laravel-kit/.github/actions/checks@main
                if: inputs.deploy-env != 'staging'
                with:
                    database: ${{ inputs.database }}
                    test-setup: ${{ inputs.test-setup }}

            -   uses: zuberkz/laravel-kit/.github/actions/upload@main
                with:
                    ssh-host: ${{ secrets.SSH_HOST }}
                    ssh-user: ${{ secrets.SSH_USER }}
                    ssh-port: ${{ secrets.SSH_PORT }}
                    deploy-key: ${{ secrets.DEPLOY_KEY }}
                    app-dir: ${{ inputs.app-dir }}
                    rsync-exclude: ${{ inputs.rsync-exclude }}

            -   uses: zuberkz/laravel-kit/.github/actions/finish@main
                if: hashFiles('artisan') != ''
                with:
                    ssh-host: ${{ secrets.SSH_HOST }}
                    ssh-user: ${{ secrets.SSH_USER }}
                    ssh-port: ${{ secrets.SSH_PORT }}
                    deploy-key: ${{ secrets.DEPLOY_KEY }}
                    app-dir: ${{ inputs.app-dir }}
                    php: ${{ inputs.php }}
                    auto-migrate: ${{ inputs.auto-migrate }}
