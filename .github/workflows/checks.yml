name: "✅ Checks"

on:
    push:
        branches:
            - main
    pull_request:

jobs:
    checks:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            -   uses: actions/checkout@v5

            -   uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    tools: composer

            -   run: composer install --no-interaction --prefer-dist --no-progress

            -   run: composer check
