# Проверки пакета в Docker, без PHP на хосте: docker compose run --rm php composer check
services:
    php:
        image: composer:2
        working_dir: /app
        volumes:
            - ./:/app
        # Своя сеть не нужна (и пул подсетей Docker на машине исчерпан): стандартный bridge
        network_mode: bridge
